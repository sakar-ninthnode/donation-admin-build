<div class="page-header">
    <div class="page-title">
        <h4>Referral</h4>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div class="container mt-4">
            <div class="card">
              <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Update Referral Links</h4>
              </div>
              <div class="card-body">
                <form [formGroup]="referralForm" (ngSubmit)="updateReferral()">
                  
                  <!-- Android Link -->
                  <div class="mb-3">
                    <div class="d-flex justify-content-between">
                      <label for="android" class="form-label bg-gray">Android Link:</label>
                          <a href="javascript:void(0)"  *ngIf="!copiedAndroid" 
                          (click)="copyText(referralForm.get('android_link')?.value, 'android')">
                        Copy Android Link
                      </a>
                      <span *ngIf="copiedAndroid" style="margin-left: 8px; color: green;">Copied!</span>
                     </div>
                    <input
                    [disabled]="userRole === 'Warehouse Admin' || userRole === 'Support Staff'"
                    *ngIf="referralForm.get('android_link')" id="android" type="url" class="form-control" formControlName="android_link" placeholder="Enter Android referral link" />
                    <div *ngIf="referralForm.get('android_link')?.invalid && referralForm.get('android_link')?.touched" class="text-danger small">
                      Invalid Android URL
                    </div>
                  </div>
          
                  <!-- iOS Link -->
                  <div class="mb-3">
                    <div class="d-flex justify-content-between">
                    <label for="ios" class="form-label bg-gray">iOS Link:</label>
                    <a href="javascript:void(0)"
                    *ngIf="!copiedIOS"  
                        (click)="copyText(referralForm.get('ios_link')?.value, 'ios')">
                        Copy iOS Link
                      </a>
                      <span *ngIf="copiedIOS" style="margin-left: 8px; color: green;">Copied!</span>
                  </div>
                    <input *ngIf="referralForm.get('ios_link')" id="ios" type="url" class="form-control" formControlName="ios_link" placeholder="Enter iOS referral link" />
                    <div *ngIf="referralForm.get('ios_link')?.invalid && referralForm.get('ios_link')?.touched" class="text-danger small">
                      Invalid iOS URL
                    </div>
                  </div>
          
                  <!-- Submit Button -->
                  <button  *ngIf="(userRole === 'Warehouse Admin' || userRole === 'Support Staff') && referralForm.valid"
                     type="submit" class="btn btn-success w-100" [disabled]="referralForm.invalid">
                        Update Referral Links
                  </button>
                </form>
              </div>
            </div>
            <div class="card" *ngIf="userRole === 'Platform Admin' && referralForm.valid">
              <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Update Referral Points</h4>
              </div>
              <div class="card-body">
                <form [formGroup]="referralPointsForm" (ngSubmit)="updateReferralPoints()">
                  
                  <!-- Android Link -->
                  <div class="mb-3">
                    <label for="android" class="form-label">Points for referrer:</label>
                    <input *ngIf="referralPointsForm.get('points_for_referrer')" id="android" type="number" class="form-control" formControlName="points_for_referrer" />
                    <div *ngIf="referralPointsForm.get('points_for_referrer')?.invalid && referralPointsForm.get('points_for_referrer')?.touched" class="text-danger small">
                      Invalid Points
                    </div>
                  </div>
          
                  <!-- iOS Link -->
                  <div class="mb-3">
                    <label for="ios" class="form-label">Points for referee:</label>
                    <input *ngIf="referralPointsForm.get('points_for_referee')" id="ios" type="number" class="form-control" formControlName="points_for_referee"/>
                    <div *ngIf="referralPointsForm.get('points_for_referee')?.invalid && referralPointsForm.get('points_for_referee')?.touched" class="text-danger small">
                      Invalid Points
                    </div>
                  </div>
          
                  <!-- Submit Button -->
                  <button type="submit" class="btn btn-success w-100" [disabled]="referralPointsForm.invalid">
                        Update Referral Points
                  </button>
                </form>
              </div>
            </div>
            <div class="card" *ngIf="userRole === 'Platform Admin' && referralForm.valid">
              <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Update Batch Points</h4>
              </div>
              <div class="card-body">
                <form [formGroup]="batchPointsForm" (ngSubmit)="updateBatchPoints()">
                  
                  <div class="mb-3">
                    <label for="android" class="form-label">Bronze Points:</label>
                    <input *ngIf="batchPointsForm.get('bronze_points')" id="android" type="number" class="form-control" formControlName="bronze_points" />
                    <div *ngIf="batchPointsForm.get('bronze_points')?.invalid && batchPointsForm.get('bronze_points')?.touched" class="text-danger small">
                      Invalid Points
                    </div>
                  </div>
          
                  <div class="mb-3">
                    <label for="ios" class="form-label">Silver Points:</label>
                    <input *ngIf="batchPointsForm.get('silver_points')" id="ios" type="number" class="form-control" formControlName="silver_points"/>
                    <div *ngIf="batchPointsForm.get('silver_points')?.invalid && batchPointsForm.get('silver_points')?.touched" class="text-danger small">
                      Invalid Points
                    </div>
                  </div>
                  <div class="mb-3">
                    <label for="ios" class="form-label">Gold Points:</label>
                    <input *ngIf="batchPointsForm.get('gold_points')" id="ios" type="number" class="form-control" formControlName="gold_points"/>
                    <div *ngIf="batchPointsForm.get('gold_points')?.invalid && batchPointsForm.get('gold_points')?.touched" class="text-danger small">
                      Invalid Points
                    </div>
                  </div>
          
                  <!-- Submit Button -->
                  <button type="submit" class="btn btn-success w-100" [disabled]="batchPointsForm.invalid">
                    Update Batch Points
                  </button>
                </form>
              </div>
            </div>
          </div>
    </div>
</div>
