<div class="page-header">
    <div class="page-title">
        <h4>Payment Info</h4>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div class="container mt-4">
            <div class="card">
              <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Payment Info</h4>
              </div>
              <div class="card-body">
                <form [formGroup]="paymentInfoForm" (ngSubmit)="updateReferral()">
                  
                  <div class="mb-3">
                    <div class="d-flex justify-content-between">
                      <label for="payee_name" class="form-label bg-gray">Payee Name:</label>
                     </div>
                    <input id="payee_name" type="text" class="form-control" formControlName="payee_name"/>
                    <div *ngIf="paymentInfoForm.get('payee_name')?.invalid && paymentInfoForm.get('payee_name')?.touched" class="text-danger small">
                      Invalid Payee Name
                    </div>
                  </div>
                  
                  <div class="mb-3">
                    <div class="d-flex justify-content-between">
                      <label for="upi_id" class="form-label bg-gray">UPI ID:</label>
                     </div>
                    <input id="upi_id" type="text" class="form-control" formControlName="upi_id"/>
                    <div *ngIf="paymentInfoForm.get('upi_id')?.invalid && paymentInfoForm.get('upi_id')?.touched" class="text-danger small">
                      Invalid UPI ID
                    </div>
                  </div>
                  <div class="mb-3">
                    <div class="d-flex justify-content-between">
                      <label for="payment_note" class="form-label bg-gray">Payment Note:</label>
                     </div>
                    <input id="payment_note" type="text" class="form-control" formControlName="payment_note"/>
                    <div *ngIf="paymentInfoForm.get('payment_note')?.invalid && paymentInfoForm.get('payment_note')?.touched" class="text-danger small">
                      Invalid Payment Note
                    </div>
                  </div>
          
                  <button
                     type="submit" class="btn btn-success w-100" [disabled]="paymentInfoForm.invalid">
                        Update Payment Info
                  </button>
                </form>
              </div>
            </div>
          </div>
    </div>
</div>
