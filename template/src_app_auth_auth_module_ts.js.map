<div class="account-content">
    <div class="login-wrapper login-new">
        <div class="login-content user-login">
            <div class="login-userset">
                <div class="login-userheading">
                    <h3>Forgot Password</h3>
                    <h4 class="verfy-mail-content">We sent a verification code to your phone number. Enter the code in the field below</h4>
                </div>
                <div class="Otp-expire text-center" *ngIf="!verifedToken">
                    <p>Invaild Token <br/><a routerLink="/forgot-password">Try again</a></p>
                </div>
                <form class="digit-group" *ngIf="verifedToken">
                    <div class="wallet-add">
                      <div class="otp-box">
                        <div class="forms-block text-center">
                          <input type="text" maxlength="1" [(ngModel)]="otpDigits[0]" name="digit1">
                          <input type="text" maxlength="1" [(ngModel)]="otpDigits[1]" name="digit2">
                          <input type="text" maxlength="1" [(ngModel)]="otpDigits[2]" name="digit3">
                          <input type="text" maxlength="1" [(ngModel)]="otpDigits[3]" name="digit4">
                        </div>
                      </div>
                    </div>
                    <div class="form-login mt-4">
                      <button type="button" (click)="verifyOtp()" class="btn btn-login">Verify OTP</button>
                    </div>
                  </form>                  
            </div>
        </div>
    </div>
</div>
