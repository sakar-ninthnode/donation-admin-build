<div class="account-content">
  <div class="login-wrapper login-new">
    <div class="login-content user-login">
      <div class="Otp-expire text-center" *ngIf="!verifedToken">
        <p>
          Invaild Token <br /><a routerLink="/forgot-password">Try again</a>
        </p>
      </div>
      <form *ngIf="verifedToken">
        <div class="login-userset">
          <div class="login-userheading">
            <h3>Reset password?</h3>
            <h4>Enter New Password & Confirm Password to get inside</h4>
          </div>

          <div class="form-login">
            <label>New Password</label>
            <div class="pass-group">
              <input
                [type]="passwordVisibility[0] ? 'text' : 'password'"
                class="pass-input"
                [(ngModel)]="newPassword"
                name="newPassword"
              />
              <span
                class="fas toggle-password"
                [ngClass]="passwordVisibility[0] ? 'fa-eye' : 'fa-eye-slash'"
                (click)="togglePassword(0)"
              ></span>
            </div>
          </div>

          <div class="form-login">
            <label>Confirm Password</label>
            <div class="pass-group">
              <input
                [type]="passwordVisibility[1] ? 'text' : 'password'"
                class="pass-input"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
              />
              <span
                class="fas toggle-password"
                [ngClass]="passwordVisibility[1] ? 'fa-eye' : 'fa-eye-slash'"
                (click)="togglePassword(1)"
              ></span>
            </div>
          </div>

          <div class="form-login">
            <button
              type="button"
              class="btn btn-login"
              (click)="updatePassword()"
            >
              Change Password
            </button>
          </div>

          <div class="signinform text-center">
            <h4>
              Return to
              <a [routerLink]="routes.signIn" class="hover-a"> login </a>
            </h4>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
