<div class="account-content">
    <div class="login-wrapper login-new">
        <div class="container">
           
            <div class="login-content user-login">
                <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
                    <div class="login-userset">
                        <div class="login-userheading">
                            <h3>Forgot password?</h3>
                            <h4>If you forgot your password, Enter your phone number and we’ll send you a one-time password (OTP) to reset it.</h4>
                        </div>
                        <div class="form-login">
                            <label>Phone number</label>
                            <div class="form-addons">
                              <input
                                type="tel"
                                class="form-control"
                                maxlength="10"
                                formControlName="phone"
                                placeholder="Enter your phone number"
                              />
                              <img style="top: 4px !important;" src="assets/img/icons/call.png" alt="img" />
                            </div>
                            <div *ngIf="submitted && f['phone'].errors" class="text-danger mt-1">
                                <small *ngIf="f['phone'].errors['required']">Phone number is required.</small>
                                <small *ngIf="f['phone'].errors['pattern']">Enter a valid 10-digit phone number.</small>
                              </div>
                              <div *ngIf="errorMessage" class="text-danger mt-2">
                                {{ errorMessage }}
                              </div>
                          </div>
                      
                          <div class="form-login">
                            <button type="submit" class="btn btn-login">Submit</button>
                          </div>
                        <div class="signinform text-center">
                            <h4>Return to<a [routerLink] = "routes.signIn" class="hover-a"> login </a></h4>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
