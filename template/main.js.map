<div class="table-footer">
  <div class="dataTables_length">
    <label></label>
  </div>
  <div class="pagination">
    <div class="col-sm-12 col-md-7">
      <div class="pagination_section">
        <nav *ngIf="pagination.total_pages > 1">
          <ul class="pagination">
            <!-- Previous Button -->
            <li class="page-item" [class.disabled]="!pagination.has_prev">
              <button
                class="page-link"
                (click)="changePage(pagination.prev_page)"
                [disabled]="!pagination.has_prev"
              >
                <i class="fa fa-angle-left"></i>
              </button>
            </li>

            <!-- Page Numbers -->
            <li *ngFor="let page of [].constructor(pagination.total_pages); let i = index">
              <button
                class="page-link"
                (click)="changePage(i + 1)"
                [class.active]="pagination.current_page === i + 1"
              >
                {{ i + 1 }}
              </button>
            </li>

            <!-- Next Button -->
            <li class="page-item" [class.disabled]="!pagination.has_next">
              <button
                class="page-link"
                (click)="changePage(pagination.next_page)"
                [disabled]="!pagination.has_next"
              >
                <i class="fa fa-angle-right"></i>
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
